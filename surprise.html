<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Surprise ❤️</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

<style>
    /* ===========================
   GIFT GLOW
=========================== */

.gift{
    animation:giftGlow 2s ease-in-out infinite;
}

@keyframes giftGlow{

0%{
    transform:scale(1);
    filter:drop-shadow(0 0 10px rgba(255,80,170,.4));
}

50%{
    transform:scale(1.03);
    filter:drop-shadow(0 0 35px rgba(255,80,170,.9));
}

100%{
    transform:scale(1);
    filter:drop-shadow(0 0 10px rgba(255,80,170,.4));
}

}

/* ===========================
   GIFT OPEN ANIMATION
=========================== */

.lid.open{

    transform:
    rotateX(130deg)
    translateY(-30px);

}

/* ===========================
   BALLOONS
=========================== */

.balloon{

    user-select:none;

    opacity:.95;

}

.balloon:nth-child(1){

left:8%;
animation-duration:14s;

}

.balloon:nth-child(2){

left:22%;
animation-duration:18s;

}

.balloon:nth-child(3){

left:38%;
animation-duration:16s;

}

.balloon:nth-child(4){

left:57%;
animation-duration:20s;

}

.balloon:nth-child(5){

left:74%;
animation-duration:17s;

}

.balloon:nth-child(6){

left:90%;
animation-duration:15s;

}

/* ===========================
   HEART PARTICLES
=========================== */

.heart{

position:fixed;

bottom:-50px;

font-size:24px;

pointer-events:none;

animation:heartFloat linear forwards;

z-index:9999;

}

@keyframes heartFloat{

0%{

transform:
translateY(0)
scale(.6);

opacity:0;

}

20%{

opacity:1;

}

100%{

transform:
translateY(-120vh)
scale(1.6);

opacity:0;

}

}

/* ===========================
   SPARKLES
=========================== */

.sparkle{

position:fixed;

width:6px;

height:6px;

background:#fff;

border-radius:50%;

box-shadow:

0 0 10px white,

0 0 20px #ffd54f,

0 0 30px #fff;

animation:sparkleAnim 2s linear forwards;

pointer-events:none;

}

@keyframes sparkleAnim{

0%{

opacity:0;

transform:scale(.2);

}

30%{

opacity:1;

}

100%{

opacity:0;

transform:
translateY(-120px)
scale(2);

}

}

/* ===========================
   FIREWORKS
=========================== */

.firework{

position:fixed;

width:10px;

height:10px;

border-radius:50%;

pointer-events:none;

animation:explode 1.3s ease-out forwards;

}

@keyframes explode{

0%{

transform:scale(.2);

opacity:1;

}

100%{

transform:scale(18);

opacity:0;

}

}

/* ===========================
   HAPPY MESSAGE EFFECT
=========================== */

#surpriseContent h2{

animation:pulseText 2s infinite;

}

@keyframes pulseText{

0%{

transform:scale(1);

}

50%{

transform:scale(1.05);

color:#fff176;

}

100%{

transform:scale(1);

}

}

/* ===========================
   BUTTON EFFECT
=========================== */

.back-btn{

transition:.35s;

box-shadow:0 0 15px rgba(255,79,162,.35);

}

.back-btn:hover{

transform:translateY(-5px);

box-shadow:

0 0 20px rgba(255,79,162,.6),

0 0 40px rgba(255,79,162,.4);

}

/* ===========================
   MOBILE
=========================== */

@media(max-width:768px){

h1{

font-size:40px;

}

.subtitle{

font-size:18px;

}

#surpriseContent h2{

font-size:34px;

}

#surpriseContent p{

font-size:18px;

line-height:1.7;

}

.gift{

transform:scale(.82);

}

}

body{
    margin:0;
    font-family:'Poppins',sans-serif;
    overflow:hidden;
    background:linear-gradient(135deg,#080811,#150d22,#2b1031);
    color:#fff;
}

/* Background */

#stars{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:-2;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.2;}
    to{opacity:1;}
}

/* Main */

.container{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    text-align:center;
    padding:20px;
}

h1{
    font-size:58px;
    color:#ff69b4;
    margin-bottom:10px;
}

.subtitle{
    font-size:22px;
    color:#ddd;
    margin-bottom:60px;
}

/* Gift Box */

.gift-wrapper{
    cursor:pointer;
    perspective:1000px;
}

.gift{
    position:relative;
    width:220px;
    height:220px;
}

.box{
    position:absolute;
    bottom:0;
    width:220px;
    height:160px;
    background:#ff4fa2;
    border-radius:12px;
    box-shadow:0 20px 40px rgba(255,0,120,.35);
}

.lid{
    position:absolute;
    top:0;
    width:220px;
    height:60px;
    background:#ff78be;
    border-radius:12px;
    transform-origin:bottom;
    transition:1s;
}

.ribbon-v{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:22px;
    height:220px;
    background:#fff;
}

.ribbon-h{
    position:absolute;
    top:24px;
    width:220px;
    height:16px;
    background:#fff;
}

.bow{
    position:absolute;
    top:-18px;
    left:50%;
    transform:translateX(-50%);
    font-size:42px;
}

/* Hidden Content */

#surpriseContent{
    display:none;
    margin-top:50px;
    animation:fadeIn 1.2s ease;
}

#surpriseContent h2{
    font-size:48px;
    color:#ffd54f;
    margin-bottom:20px;
}

#surpriseContent p{
    font-size:22px;
    max-width:850px;
    line-height:1.8;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Balloons */

.balloon{
    position:absolute;
    bottom:-180px;
    font-size:70px;
    animation:floatUp linear infinite;
}

@keyframes floatUp{

0%{
transform:translateY(0);
}

100%{
transform:translateY(-140vh);
}

}

/* Back Button */

.back-btn{

margin-top:40px;

display:inline-block;

padding:16px 35px;

border-radius:40px;

background:#ff4fa2;

color:white;

text-decoration:none;

font-weight:600;

}


/* LOVE LETTER */
.letter-paper{max-width:900px;margin:40px auto;padding:60px;background:linear-gradient(180deg,#fffdf5,#fff8e8);color:#4b2e2e;border-radius:20px;box-shadow:0 15px 40px rgba(0,0,0,.35);border:8px solid #f6e6c5;}
.letter-title{font-family:'Allura',cursive;font-size:60px;text-align:center;color:#d63384;}
.love-letter{font-family:'Allura',cursive;font-size:34px;line-height:2.1;color:#4a2f2f;text-align:justify;}
.signature{text-align:right;font-family:'Allura',cursive;font-size:42px;color:#d63384;margin-top:40px;}

</style>

</head>

<body>
<body>

<!-- Animated Background -->
<div id="stars"></div>
<div id="heartsContainer"></div>

<!-- Music -->
<audio id="birthdayMusic" loop>
    <source src="music/birthday-song.mp3" type="audio/mpeg">
</audio>

<!-- Main Container -->
<div class="container">

    <h1 class="mainTitle">
        🎁 One Last Surprise
    </h1>

    <p class="subtitle">
        Tap the Gift Box to unlock something made only for you ❤️
    </p>

    <!-- Gift -->
    <div class="gift-wrapper" id="giftWrapper">

        <div class="gift">

            <div class="lid" id="lid"></div>

            <div class="box"></div>

            <div class="ribbon-v"></div>

            <div class="ribbon-h"></div>

            <div class="bow">
                🎀
            </div>

        </div>

    </div>

    <!-- Hidden Content -->
    <div id="surpriseContent">

        <!-- 8 Reasons Page -->
        <section id="reasonsSection">

            <h2 class="sectionTitle">

                ❤️ 8 Reasons Why I'll Always Love You ❤️

            </h2>

            <div class="reasonCard">

                <img
                    id="reasonImage"
                    src="images/Photo1.jpg"
                    alt="Reason Photo"
                >

                <h3 id="reasonTitle">

                    ❤️ Reason 1

                </h3>

                <p id="reasonText">

                </p>

                <button
                    id="nextReasonBtn"
                    class="btn">

                    Next Reason ❤️

                </button>

            </div>

        </section>

        <!-- Letter (Hidden Initially) -->

        <section
            id="letterSection"
            style="display:none;">

            <!-- We'll build this in Part 3 -->

        </section>

        <!-- Final Section -->

        <section
            id="finalSection"
            style="display:none;">

            <!-- We'll build this in Part 4 -->

        </section>

        <a href="index.html" class="back-btn">

            🏠 Back Home

        </a>

    </div>

</div>

<script src="script.js"></script>

</body>


</body>

</html>
