<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Beautiful Memories ❤️</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body{
            background:#080811;
        }

        .gallery-page{

            padding:120px 8%;
        }

        .gallery-title{

            text-align:center;

            font-size:50px;

            margin-bottom:15px;

            color:#ff4fa2;
        }

        .gallery-sub{

            text-align:center;

            font-size:20px;

            opacity:.8;

            margin-bottom:60px;
        }

        .photo-grid{

            display:grid;

            grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

            gap:25px;
        }

        .photo{

            overflow:hidden;

            border-radius:20px;

            cursor:pointer;

            position:relative;

            transition:.4s;

            box-shadow:0 0 20px rgba(255,255,255,.08);
        }

        .photo img{

            width:100%;

            height:360px;

            object-fit:cover;

            transition:.6s;
        }

        .photo:hover img{

            transform:scale(1.12);
        }

        .photo:hover{

            transform:translateY(-10px);
        }

        .caption{

            position:absolute;

            bottom:0;

            width:100%;

            padding:20px;

            background:linear-gradient(transparent,rgba(0,0,0,.95));

            color:white;

            font-size:18px;
        }

        .lightbox{

            position:fixed;

            inset:0;

            background:rgba(0,0,0,.92);

            display:none;

            justify-content:center;

            align-items:center;

            z-index:9999;
        }

        .lightbox img{

            max-width:90%;

            max-height:90%;

            border-radius:15px;
        }

        .close{

            position:absolute;

            top:30px;

            right:40px;

            font-size:45px;

            cursor:pointer;

            color:white;
        }

        .back{

            display:block;

            width:max-content;

            margin:60px auto 0;

            padding:15px 35px;

            border-radius:40px;

            background:#ff4fa2;

            color:white;

            text-decoration:none;

            font-weight:600;
        }

    </style>

</head>

<body>

<section class="gallery-page">

<h1 class="gallery-title">

Our Beautiful Memories ❤️

</h1>

<p class="gallery-sub">

Every picture reminds me how lucky I am to have you.

</p>

<div class="photo-grid">

<div class="photo">

<img src="images/photo1.jpg" onclick="openImage(this.src)">

<div class="caption">

The Day Everything Started ❤️

</div>

</div>

<div class="photo">

<img src="images/photo2.jpg" onclick="openImage(this.src)">

<div class="caption">

My Favourite Smile 😊

</div>

</div>

<div class="photo">

<img src="images/photo3.jpg" onclick="openImage(this.src)">

<div class="caption">

Forever Together 💕

</div>

</div>

<div class="photo">

<img src="images/photo4.jpg" onclick="openImage(this.src)">

<div class="caption">

Beautiful Memories ✨

</div>

</div>

<div class="photo">

<img src="images/photo5.jpg" onclick="openImage(this.src)">

<div class="caption">

The Best Part of My Life ❤️

</div>

</div>

<div class="photo">

<img src="images/photo6.jpg" onclick="openImage(this.src)">

<div class="caption">

Endless Love 🌹

</div>

</div>

<div class="photo">

<img src="images/photo7.jpg" onclick="openImage(this.src)">

<div class="caption">

Every Moment Matters 💖

</div>

</div>

<div class="photo">

<img src="images/photo8.jpg" onclick="openImage(this.src)">

<div class="caption">

You Complete Me ❤️

</div>

</div>

<div class="photo">

<img src="images/photo9.jpg" onclick="openImage(this.src)">

<div class="caption">

Always & Forever 💍

</div>

</div>

</div>

<a class="back" href="index.html">

⬅ Back Home

</a>

</section>

<div class="lightbox" id="lightbox">

<span class="close" onclick="closeImage()">

&times;

</span>

<img id="lightbox-img">

</div>

<script>

function openImage(src){

document.getElementById("lightbox").style.display="flex";

document.getElementById("lightbox-img").src=src;

}

function closeImage(){

document.getElementById("lightbox").style.display="none";

}

document.getElementById("lightbox").addEventListener("click",function(e){

if(e.target.id==="lightbox"){

closeImage();

}

});

</script>

</body>

</html>
